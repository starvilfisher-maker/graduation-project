name: Research scaffold checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate code and proposed protocol
        run: bash scripts/setup_codex.sh
      - name: Install optional audit dependencies
        run: python -m pip install '.[audit]'
      - name: Run pixel and workbook audit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

